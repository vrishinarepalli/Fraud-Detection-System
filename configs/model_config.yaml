# Default hyperparameters for all models.
# Override by passing a custom config path to train().
# Do not commit Optuna-tuned best_params.yaml — it is git-ignored.

xgboost:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 1
  gamma: 0
  reg_alpha: 0.1
  reg_lambda: 1.0
  n_jobs: -1
  random_state: 42

lightgbm:
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  num_leaves: 63
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_samples: 20
  reg_alpha: 0.1
  reg_lambda: 1.0
  n_jobs: -1
  random_state: 42

logistic_regression:
  C: 0.1
  solver: lbfgs
